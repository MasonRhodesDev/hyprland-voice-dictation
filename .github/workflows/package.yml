name: Package

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/arch-package.yml@77a592545a6cf6b7cb1ddfc5ee07126037f4feb1

  rpm:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/rpm-check.yml@77a592545a6cf6b7cb1ddfc5ee07126037f4feb1
    with:
      spec-name: hyprland-voice-dictation
